<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#1d2433;--muted:#5d6678;--pri:#0f6e5c;--pri2:#e2f3ee;--acc:#e8862a;--acc2:#fdf0e2;--bad:#c4372f;--bad2:#fbe6e4;--good:#1f8a4c;--good2:#e3f5ea;--line:#e6dfd2;--sh:0 2px 10px rgba(30,30,50,.07);--r:14px}

.fb{padding:10px;border-radius:10px;margin-top:8px}.fb.ok{background:var(--good2)}.fb.no{background:var(--bad2)}
input,select,textarea{font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9em}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}th{background:var(--pri2)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:1.4em;color:var(--pri)}
.flash{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.3em;cursor:pointer;perspective:800px}
.word{display:inline-block;padding:3px 7px;margin:3px;border-radius:7px;border:1.5px solid var(--line);cursor:pointer;background:var(--card)}
.word.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.word.ok{background:var(--good);color:#fff}.word.miss{border-color:var(--bad);border-style:dashed}
.chip{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:20px;padding:2px 10px;font-size:.78em;margin:2px}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;z-index:99;font-size:.9em;display:none}
.roadmap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.roadmap span{background:var(--pri2);color:var(--pri);padding:4px 10px;border-radius:8px;font-size:.8em;font-weight:600}
.hero{background:linear-gradient(135deg,var(--pri),#0b4f43);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.hero h1{color:#fff}.hero p{margin:.2em 0;opacity:.92}
footer{text-align:center;color:var(--muted);font-size:.8em;padding:20px}

@media print{header,.noprint,.btn,footer,.toast{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;border:none}main{max-width:none}.ans-key{page-break-before:always}}

 <div class="hrow">

<script>
/* ================= STATE ================= */
const LS='ksAdjV1';
let S=JSON.parse(localStorage.getItem(LS)||'null')||{lang:'en',dark:false,done:{},att:0,cor:0,typeStats:{},mist:[],bm:[],xp:0,streak:0,lastDay:'',tests:[],daily:{}};
function save(){localStorage.setItem(LS,JSON.stringify(S))}
const $=id=>document.getElementById(id);
const app=$('app');
const KN=()=>S.lang==='kn';
function t(en,kn){return KN()&&kn?kn:en}
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hl(s){return esc(s).replace(/\[(.+?)\]/g,'<mark>$1</mark>')}
function today(){return new Date().toISOString().slice(0,10)}
(function streak(){const d=today();if(S.lastDay!==d){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=d;save()}})();

/* ================= SPEECH ================= */
let rate=1,lastSpoken='';
function speak(txt,r){if(!('speechSynthesis' in window)){toast('Pronunciation not supported in this browser');return}
 lastSpoken=txt;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='en-IN';u.rate=r||rate;
 const v=speechSynthesis.getVoices().find(v=>/en[-_](IN|GB|US)/.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function sp(txt){return `<button class="btn sm alt" onclick="speak('${txt.replace(/'/g,"\\'")}')" aria-label="Listen">🔊</button>`}

/* ================= LESSON CONTENT ================= */
// ex: sentences, adjective marked with [ ]
const L=[
{id:'what',ic:'📘',en:'What is an Adjective?',kn:'ವಿಶೇಷಣ ಎಂದರೇನು?',
 d:'An adjective is a word that describes or gives more information about a noun or pronoun. It tells us what kind, how many, how much, which one, or whose.',
 dk:'ನಾಮಪದ ಅಥವಾ ಸರ್ವನಾಮದ ಗುಣ, ಪ್ರಮಾಣ, ಸಂಖ್ಯೆ ಅಥವಾ ಸ್ವಭಾವವನ್ನು ವಿವರಿಸುವ ಪದವನ್ನು ವಿಶೇಷಣ ಎನ್ನುತ್ತೇವೆ.',
 ex:['She has a [beautiful] garden.','I bought [three] pens.','The sky is [blue].','[This] book is mine.'],
 tip:'Ask: What kind? How many? How much? Which? Whose? The answer word is usually an adjective.',tipk:'ಯಾವ ರೀತಿಯ? ಎಷ್ಟು? ಯಾವುದು? ಯಾರದು? ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಉತ್ತರವೇ ವಿಶೇಷಣ.'},
{id:'identify',ic:'🔍',en:'Identifying Adjectives',kn:'ವಿಶೇಷಣ ಗುರುತಿಸುವಿಕೆ',
 d:'Find the noun first, then look for the word that describes it. Adjectives usually come before a noun (attributive) or after a linking verb like is, am, are, was, seem, look, become (predicative).',
 dk:'ಮೊದಲು ನಾಮಪದವನ್ನು ಹುಡುಕಿ, ನಂತರ ಅದನ್ನು ವಿವರಿಸುವ ಪದವನ್ನು ಗುರುತಿಸಿ. ವಿಶೇಷಣ ಸಾಮಾನ್ಯವಾಗಿ ನಾಮಪದದ ಮೊದಲು ಅಥವಾ is/was ನಂತರ ಬರುತ್ತದೆ.',
 ex:['The [tall] boy won.','The boy is [tall].','The soup tastes [delicious].','He became [famous].'],
 tip:'Words after "look, feel, taste, smell, sound, seem" are usually adjectives, not adverbs.'},
{id:'quality',ic:'🌈',en:'Adjectives of Quality',kn:'ಗುಣವಾಚಕ ವಿಶೇಷಣ',
 d:'They describe the kind or quality of a noun. Answer the question "What kind?". Examples: good, bad, honest, brave, red, big, clever, Indian.',
 dk:'ನಾಮಪದದ ಗುಣವನ್ನು ತಿಳಿಸುತ್ತವೆ. "ಯಾವ ರೀತಿಯ?" ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಉತ್ತರ.',
 ex:['Ravi is an [honest] man.','She wore a [red] saree.','It was a [cold] morning.']},
{id:'quantity',ic:'⚖️',en:'Adjectives of Quantity',kn:'ಪ್ರಮಾಣವಾಚಕ ವಿಶೇಷಣ',
 d:'They show how much of a thing (uncountable nouns). Examples: some, much, little, enough, whole, all, no, any, sufficient, half.',
 dk:'ಒಂದು ವಸ್ತು ಎಷ್ಟು ಪ್ರಮಾಣದಲ್ಲಿದೆ ಎಂದು ತಿಳಿಸುತ್ತವೆ (ಎಣಿಸಲಾಗದ ನಾಮಪದಗಳು).',
 ex:['There is [little] milk.','He ate the [whole] cake.','We have [enough] time.','I want [some] water.']},
{id:'number',ic:'🔢',en:'Adjectives of Number',kn:'ಸಂಖ್ಯಾವಾಚಕ ವಿಶೇಷಣ',
 d:'They show how many or in what order. Definite: one, two, first, second. Indefinite: many, few, several, some, all. Distributive: each, every, either, neither.',
 dk:'ಎಷ್ಟು ಅಥವಾ ಯಾವ ಕ್ರಮ ಎಂಬುದನ್ನು ತಿಳಿಸುತ್ತವೆ. ಉದಾ: ಒಂದು, ಮೊದಲ, ಅನೇಕ.',
 ex:['I have [two] brothers.','He came [first].','[Many] students passed.','[Few] people know this.']},
{id:'demo',ic:'👉',en:'Demonstrative Adjectives',kn:'ನಿರ್ದೇಶಕ ವಿಶೇಷಣ',
 d:'They point out which noun: this, that (singular), these, those (plural). They are adjectives only when followed by a noun.',
 dk:'ಯಾವ ವಸ್ತು ಎಂದು ತೋರಿಸುತ್ತವೆ: this, that, these, those. ನಂತರ ನಾಮಪದ ಇದ್ದರೆ ಮಾತ್ರ ವಿಶೇಷಣ.',
 ex:['[This] pen is new.','[Those] mangoes are sweet.','Compare: "This is new." → this = pronoun.']},
{id:'poss',ic:'🏠',en:'Possessive Adjectives',kn:'ಸ್ವಾಮ್ಯಸೂಚಕ ವಿಶೇಷಣ',
 d:'They show ownership: my, your, his, her, its, our, their. Always followed by a noun. (mine, yours, hers = pronouns.)',
 dk:'ಮಾಲೀಕತ್ವ ತೋರಿಸುತ್ತವೆ: my, your, his, her, its, our, their.',
 ex:['This is [my] bag.','The dog wagged [its] tail.','[Their] house is big.'],
 tip:'its = possessive; it\'s = it is. Never write "it\'s tail".'},
{id:'interrog',ic:'❓',en:'Interrogative Adjectives',kn:'ಪ್ರಶ್ನಾರ್ಥಕ ವಿಶೇಷಣ',
 d:'What, which, whose — used with a noun to ask a question.',dk:'ನಾಮಪದದೊಂದಿಗೆ ಪ್ರಶ್ನೆ ಕೇಳಲು: what, which, whose.',
 ex:['[What] time is it?','[Which] colour do you like?','[Whose] book is this?']},
{id:'distrib',ic:'🧩',en:'Distributive Adjectives',kn:'ವಿಭಾಗವಾಚಕ ವಿಶೇಷಣ',
 d:'Each, every, either, neither — refer to persons/things one by one. They take a singular noun and singular verb.',
 dk:'ಒಬ್ಬೊಬ್ಬರನ್ನಾಗಿ ಸೂಚಿಸುತ್ತವೆ: each, every, either, neither. ಏಕವಚನ ನಾಮಪದ ಮತ್ತು ಕ್ರಿಯಾಪದ.',
 ex:['[Each] student has a book.','[Every] boy was present.','[Neither] answer is correct.']},
{id:'proper',ic:'🌏',en:'Proper Adjectives',kn:'ವಿಶಿಷ್ಟನಾಮ ವಿಶೇಷಣ',
 d:'Formed from proper nouns; always begin with a capital letter: India → Indian, Shakespeare → Shakespearean, France → French.',
 dk:'ವಿಶಿಷ್ಟ ನಾಮಪದದಿಂದ ಬಂದವು; ಯಾವಾಗಲೂ ದೊಡ್ಡ ಅಕ್ಷರದಿಂದ ಆರಂಭ.',
 ex:['I love [Indian] food.','She studies [French] literature.']},
{id:'compound',ic:'🔗',en:'Compound Adjectives',kn:'ಸಂಯುಕ್ತ ವಿಶೇಷಣ',
 d:'Two or more words joined (usually with a hyphen) to describe a noun: well-known, ten-year-old, part-time, kind-hearted. The number stays singular: a five-star hotel (not five-stars).',
 dk:'ಎರಡು ಪದಗಳು hyphen ಮೂಲಕ ಸೇರಿ ವಿಶೇಷಣವಾಗುತ್ತವೆ. ಉದಾ: well-known.',
 ex:['He is a [well-known] author.','She has a [ten-year-old] son.','It was a [two-hour] film.']},
{id:'particip',ic:'🎭',en:'Participial Adjectives',kn:'ಕೃದಂತ ವಿಶೇಷಣ',
 d:'Formed from verbs. -ing describes the cause (the thing): boring, exciting. -ed describes the feeling (the person): bored, excited.',
 dk:'ಕ್ರಿಯಾಪದದಿಂದ ಬಂದವು. -ing = ಕಾರಣ (ವಸ್ತು), -ed = ಭಾವನೆ (ವ್ಯಕ್ತಿ).',
 ex:['The movie was [boring].','I was [bored].','A [broken] chair.','The news is [surprising].']},
{id:'attpred',ic:'📍',en:'Attributive & Predicative',kn:'ಗುಣಾತ್ಮಕ ಮತ್ತು ವಿಧೇಯ ವಿಶೇಷಣ',
 d:'Attributive: before the noun (a happy child). Predicative: after a linking verb (The child is happy). Some adjectives are only predicative: afraid, asleep, alive, alone, awake.',
 dk:'ನಾಮಪದದ ಮೊದಲು = Attributive. is/seem ನಂತರ = Predicative. afraid, asleep ನಂತಹವು ನಂತರ ಮಾತ್ರ.',
 ex:['A [happy] child (attributive)','The child is [happy] (predicative)','The baby is [asleep]. (not "an asleep baby")']},
{id:'coord',ic:'⚡',en:'Coordinate Adjectives',kn:'ಸಮಾನ ವಿಶೇಷಣಗಳು',
 d:'Two adjectives of equal rank describing the same noun; separated by a comma or "and". Test: can you swap them or add "and"? Then use a comma.',
 dk:'ಸಮಾನ ಮಹತ್ವದ ಎರಡು ವಿಶೇಷಣಗಳು; ನಡುವೆ comma ಅಥವಾ and.',
 ex:['A [long, tiring] journey.','A [warm and friendly] host.','But: a [bright red] car (no comma).']},
{id:'formation',ic:'🛠️',en:'Adjective Formation',kn:'ವಿಶೇಷಣ ರಚನೆ',
 d:'Adjectives are formed by adding suffixes to nouns/verbs: -ful (beauty→beautiful), -less (care→careless), -ous (danger→dangerous), -y (rain→rainy), -al (nation→national), -ive (act→active), -able (read→readable), -ish (child→childish), -ic (hero→heroic), -ly (friend→friendly), -en (wood→wooden). Prefixes give opposites: un-, in-, im-, ir-, il-, dis-.',
 dk:'ನಾಮಪದ/ಕ್ರಿಯಾಪದಕ್ಕೆ -ful, -less, -ous, -y, -al, -ive ಇತ್ಯಾದಿ ಸೇರಿಸಿ ವಿಶೇಷಣ ರಚಿಸಬಹುದು. un-, im-, dis- ವಿರುದ್ಧಾರ್ಥ.',
 ex:['beauty → [beautiful]','care → [careless]','danger → [dangerous]','possible → [impossible]','legal → [illegal]']},
{id:'degrees',ic:'📶',en:'Degrees of Comparison',kn:'ಹೋಲಿಕೆಯ ಮಟ್ಟಗಳು',
 d:'Positive (no comparison): tall. Comparative (two): taller than. Superlative (three or more): the tallest. Short words add -er/-est; long words use more/most. Double the consonant: big→bigger; y→i: happy→happier.',
 dk:'Positive = ಹೋಲಿಕೆ ಇಲ್ಲ; Comparative = ಎರಡರ ನಡುವೆ (than); Superlative = ಮೂರು ಅಥವಾ ಹೆಚ್ಚು (the).',
 ex:['Ram is [tall].','Ram is [taller] than Shyam.','Ram is [the tallest] in the class.','This is [more beautiful] than that.'],
 tip:'Never use double comparatives: "more better" ✗ → "better" ✓.'},
{id:'irregular',ic:'🌀',en:'Irregular Comparison',kn:'ಅನಿಯಮಿತ ಹೋಲಿಕೆ',
 d:'good/well–better–best; bad/ill–worse–worst; many/much–more–most; little–less–least; far–farther/further–farthest/furthest; old–older/elder–oldest/eldest; late–later/latter–latest/last.',
 dk:'ಕೆಲವು ವಿಶೇಷಣಗಳು ನಿಯಮ ಪಾಲಿಸುವುದಿಲ್ಲ: good–better–best.',
 ex:['This is [better] than that.','He is my [elder] brother. (family)','He is [older] than me. (than)','For [further] details, call us.']},
{id:'structures',ic:'🏗️',en:'Comparative Structures',kn:'ಹೋಲಿಕೆ ರಚನೆಗಳು',
 d:'as + positive + as (as tall as); not so/as…as; comparative + than; the + comparative, the + comparative (The more you read, the wiser you become); "superior, inferior, senior, junior, prior, prefer" take "to" not "than"; "one of the + superlative + plural noun".',

 else if(/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(w)){c=w+w.slice(-1)+'er';s=w+w.slice(-1)+'est'}
 else if(w.length<=5||/(ow|er)$/.test(w)&&w.length<7){c=w+'er';s=w+'est'}else{c='more '+w;s='most '+w}return [w,c,s]}

function recordAns(q,ok,chosen){S.att++;if(ok){S.cor++;S.xp+=2}const ts=S.typeStats[q.type]||(S.typeStats[q.type]=[0,0]);ts[0]++;if(ok)ts[1]++;

function runQuiz(qs,target,o={}){if(!qs.length){$(target).innerHTML='<p>No questions available.</p>';return}
 let i=0,score=0,start=Date.now(),wrong=[],timer=null,left=o.time||0;
 const box=$(target);
 const tick=()=>{if(!o.time)return;left--;const tEl=$(target+'_t');if(tEl)tEl.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(timer);finish()}};
 if(o.time)timer=setInterval(tick,1000);
 const show=()=>{const q=qs[i];const opts=shuffle(q.opts);
  box.innerHTML=`<div class="${o.inline?'':'card'}">${o.time?`<div class="row" style="justify-content:space-between"><span class="chip" id="${target}_t">⏱</span><span class="chip">Score ${score}</span></div>`:''}
  <div class="tag">Q ${i+1}/${qs.length} • ${TYPES[q.type]||''} • ${['','Easy','Medium','Hard','Competitive'][q.lv]}</div><h3>${esc(q.q)} ${sp(q.q.replace(/\[.*?\]/,''))}</h3>
  ${opts.map(op=>`<button class="opt" data-v="${esc(op)}">${esc(op)}</button>`).join('')}<div id="${target}_f"></div></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(box._lock)return;box._lock=1;const v=b.dataset.v,ok=v===q.a;
   box.querySelectorAll('.opt').forEach(x=>{if(x.dataset.v===q.a)x.classList.add('ok')});if(!ok){b.classList.add('no');wrong.push(q)}else score++;
   recordAns(q,ok,v);
   $(target+'_f').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Correct!':'❌ Answer: <b>'+esc(q.a)+'</b>'}<br>${esc(q.ex)}</div><button class="btn" onclick="this.parentNode.parentNode._next&&0">Next →</button>`;
   $(target+'_f').querySelector('.btn').onclick=()=>{box._lock=0;i++;i<qs.length?show():finish()}})};
 const finish=()=>{clearInterval(timer);box._lock=0;const pct=Math.round(score/qs.length*100),secs=Math.round((Date.now()-start)/1000);
  if(o.name){S.tests.push({n:o.name,s:score,t:qs.length,d:today()});save()}if(o.onDone)o.onDone(score);

 show()}

 $('pr').innerHTML=`<div class="card"><h3>Type the ${k===1?'comparative':'superlative'} of "<b>${b[0]}</b>"</h3><input id="fg" autocomplete="off"><button class="btn" onclick="fgC()">Check</button><button class="btn alt" onclick="fillGame()">Next</button><div id="fgf"></div></div>`;
 window.fgC=()=>{const v=$('fg').value.trim().toLowerCase(),ok=b[k].split('/').includes(v)||b[k]===v;$('fgf').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Correct!':'❌ '+b[k]}</div>`;S.att++;if(ok){S.cor++;S.xp+=2}save()};$('pr').scrollIntoView({behavior:'smooth'})}
V.comp=()=>{app.innerHTML=back()+`<h1>🏆 ${t('Competitive Exam Zone','ಸ್ಪರ್ಧಾತ್ಮಕ ಪರೀಕ್ಷೆ')}</h1><div class="card"><p>Exam-style questions for SSC, Banking, Railways, KPSC, TET, UPSC and more. Focus areas: error spotting, degrees, few/little, each/every, superior/senior + to.</p>
<div class="kn">💡 Shortcut rules: double comparative ✗ • "of the two" → the + comparative • "than any other" + singular • absolute adjectives (perfect, unique, complete) not compared • preferable/superior/junior + to.</div>
<button class="btn" onclick="runQuiz(shuffle(Q.filter(q=>q.lv>=3||q.type==='error')).slice(0,15),'cz',{time:600,name:'Competitive',again:'comp'})">Start 15-Q timed set (10 min)</button></div><div id="cz"></div>`};
V.grand=()=>{app.innerHTML=back()+`<h1>🎓 ${t('Grand Adjective Test','ಮಹಾ ಪರೀಕ್ಷೆ')}</h1><div class="card"><p>40 questions from all topics and all levels • 30 minutes • Result saved to your progress.</p><button class="btn" onclick="this.parentNode.remove();runQuiz(grandSet(),'gt',{time:1800,name:'Grand Test',again:'grand'})">Begin Grand Test</button></div><div id="gt"></div>`};
function grandSet(){let out=[];Object.keys(TYPES).forEach(k=>out.push(...pickQs(3,{type:k})));return shuffle(out).slice(0,40)}
V.daily=()=>{const d=today();let seed=[...d].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7);const r=()=>(seed=seed*1103515245+12345>>>0)/4294967296;
 const qs=Q.slice().sort(()=>r()-.5).slice(0,5);const done=S.daily[d];
 app.innerHTML=back()+`<h1>📅 ${t('Daily Adjective Challenge','ದೈನಂದಿನ ಸವಾಲು')}</h1><p class="tag">${d} • 5 new questions every day ${done!=null?'• Today: '+done+'/5 ✔':''}</p><div id="dc"></div>`;
 runQuiz(qs,'dc',{again:'daily',onDone:s=>{S.daily[d]=s;S.xp+=5;save()}})};

/* ---------- MISTAKES / REVISION / FLASH / BOOKMARKS ---------- */
const QBYID=id=>Q.find(q=>q.id===id);
V.mist=()=>{const ms=S.mist.map(m=>({...m,q:QBYID(m.id)})).filter(m=>m.q);
app.innerHTML=back()+`<h1>📕 ${t('Mistake Book','ತಪ್ಪುಗಳ ಪುಸ್ತಕ')}</h1><p class="tag">${ms.length} questions to review. Answer them correctly in revision to remove them.</p>
<div class="row noprint"><button class="btn" onclick="reviseMist()">Practise my mistakes</button><button class="btn alt" onclick="if(confirm('Clear mistake book?')){S.mist=[];save();V.mist()}">Clear</button></div>
${ms.map(m=>`<div class="card"><b>${esc(m.q.q)}</b><br>❌ Your answer: ${esc(m.chosen)}<br>✔ Correct: <b>${esc(m.q.a)}</b><br><span class="tag">${esc(m.q.ex)} • ${TYPES[m.q.type]} • ${m.d}</span></div>`).join('')||'<div class="card">🎉 No mistakes yet!</div>'}<div id="mr"></div>`};
function reviseMist(){S._rev=1;runQuiz(shuffle(S.mist.map(m=>QBYID(m.id)).filter(Boolean)).slice(0,10),'mr',{again:'mist',onDone:()=>{S._rev=0;save()}});$('mr').scrollIntoView()}
V.revision=()=>{const weak=Object.entries(S.typeStats).map(([k,v])=>[k,v[1]/v[0]]).sort((a,b)=>a[1]-b[1]).slice(0,3).map(x=>x[0]);
app.innerHTML=back()+`<h1>🔁 ${t('Smart Revision','ಪುನರಾವರ್ತನೆ')}</h1><div class="card"><h3>One-page summary</h3><table>
<tr><th>Type</th><th>Question it answers</th><th>Example</th></tr>
<tr><td>Quality</td><td>What kind?</td><td>honest, red</td></tr><tr><td>Quantity</td><td>How much?</td><td>some, little, enough</td></tr><tr><td>Number</td><td>How many / which order?</td><td>two, first, many</td></tr><tr><td>Demonstrative</td><td>Which?</td><td>this, those</td></tr><tr><td>Possessive</td><td>Whose?</td><td>my, their</td></tr><tr><td>Interrogative</td><td>asks</td><td>what, which, whose</td></tr><tr><td>Distributive</td><td>one by one</td><td>each, every, either, neither</td></tr></table>
<div class="kn">OSASCOMP • -er/-est for short words, more/most for long • few/little = negative, a few/a little = positive • linking verb + adjective</div></div>
<div class="card"><h3>Revise your weak areas</h3>${weak.length?weak.map(k=>`<span class="chip">${TYPES[k]}</span>`).join(''):'<p>Attempt some quizzes first.</p>'}<br><button class="btn" onclick="runQuiz(${weak.length?'shuffle(Q.filter(q=>'+JSON.stringify(weak)+'.includes(q.type))).slice(0,10)':'pickQs(10)'},'rv',{again:'revision'})">Start revision set</button></div><div id="rv"></div>`};
let fi=0,fset=[];
V.flash=()=>{fset=shuffle([...BANK.map(b=>({f:b[0],b:`${b[1]} • ${b[2]}<br><span class="tag">${b[3]}</span>`})),...L.map(l=>({f:l.en,b:esc(l.d.slice(0,160))+'…'}))]);fi=0;drawFlash()};
function drawFlash(fl){const c=fset[fi];app.innerHTML=back()+`<h1>🃏 ${t('Flashcards','ಫ್ಲ್ಯಾಶ್‌ಕಾರ್ಡ್')}</h1><p class="tag">${fi+1}/${fset.length} • tap card to flip</p><div class="card flash" onclick="drawFlash(${!fl})">${fl?c.b:'<b>'+esc(c.f)+'</b>'}</div><div class="row"><button class="btn alt" onclick="fi=(fi-1+fset.length)%fset.length;drawFlash()">← Prev</button>${sp(c.f)}<button class="btn" onclick="fi=(fi+1)%fset.length;drawFlash()">Next →</button></div>`}
V.bm=()=>{app.innerHTML=back()+`<h1>🔖 ${t('Bookmarks','ಬುಕ್‌ಮಾರ್ಕ್')}</h1>`+(L.filter(l=>S.bm.includes(l.id)).map(lessonHTML).join('')||'<div class="card">No bookmarks yet. Tap "🔖 Save" on any lesson.</div>')};
V.bank=()=>{app.innerHTML=back()+`<h1>📚 ${t('Adjective Reference Bank','ಪದ ಭಂಡಾರ')}</h1><input placeholder="Filter…" oninput="[...document.querySelectorAll('#bt tr')].slice(1).forEach(r=>r.style.display=r.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')"><div class="card"><table id="bt"><tr><th>Positive</th><th>Comparative</th><th>Superlative</th><th>ಕನ್ನಡ</th><th></th></tr>${BANK.map(b=>`<tr><td>${b[0]}</td><td>${b[1]}</td><td>${b[2]}</td><td>${b[3]}</td><td>${sp(b.slice(0,3).join(', '))}</td></tr>`).join('')}</table></div>`};

/* ---------- WORKSHEET / PAPER ---------- */
V.worksheet=()=>{app.innerHTML=back()+`<h1>📄 ${t('Worksheet Generator','ವರ್ಕ್‌ಶೀಟ್')}</h1><div class="card noprint"><div class="row">
<select id="wt"><option value="all">Mixed topics</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
<select id="wl"><option value="0">All levels</option><option value="1">Easy</option><option value="2">Medium</option><option value="3">Hard</option><option value="4">Competitive</option></select>
<select id="wn"><option>10</option><option>15</option><option>20</option><option>25</option></select><button class="btn" onclick="genWS()">Generate</button><button class="btn alt" onclick="window.print()">🖨 Print</button></div></div><div id="ws"></div>`};
function sheet(qs,title,meta){return `<div class="card"><h2 style="text-align:center">KS LEARNING CENTER<br><small>${title}</small></h2><p>Name: ____________ Class: ______ Date: ______ ${meta||''}</p>
${qs.map((q,i)=>`<div class="ws-q"><b>${i+1}.</b> ${esc(q.q)}<br>${shuffle(q.opts).map((o,j)=>`(${'abcd'[j]}) ${esc(o)}`).join(' &nbsp; ')}</div>`).join('')}
<div class="ans-key"><h3>Answer Key</h3>${qs.map((q,i)=>`${i+1}. ${esc(q.a)}`).join(' • ')}</div></div>`}
function genWS(){const qs=pickQs(+$('wn').value,{type:$('wt').value,lv:$('wl').value});$('ws').innerHTML=sheet(qs,'Adjective Worksheet – '+($('wt').value==='all'?'Mixed':TYPES[$('wt').value]))}
V.paper=()=>{app.innerHTML=back()+`<h1>🧾 ${t('Practice Paper Generator','ಅಭ್ಯಾಸ ಪತ್ರಿಕೆ')}</h1><div class="card noprint"><div class="row">
${[['Class Test','20 marks',20],['Unit Test','30 marks',30],['Competitive Mock','40 marks',40]].map(([n,m,c])=>`<button class="btn" onclick="genPaper('${n}',${c})">${n} (${m})</button>`).join('')}<button class="btn alt" onclick="window.print()">🖨 Print</button></div></div><div id="pp"></div>`};
function genPaper(n,c){let qs=[];const ks=Object.keys(TYPES);while(qs.length<c){const q=pickQs(1,{type:ks[qs.length%ks.length]})[0];if(q&&!qs.includes(q))qs.push(q)}$('pp').innerHTML=sheet(qs,'Adjective '+n,`Max marks: ${c} • Time: ${c*1.5} min`)}

/* ---------- PROGRESS / SETTINGS ---------- */
V.progress=()=>{const acc=S.att?Math.round(S.cor/S.att*100):0,lv=Object.keys(S.done).length,lvl=S.xp<100?'Beginner':S.xp<300?'Learner':S.xp<700?'Skilled':S.xp<1500?'Expert':'Adjective Master';
 const badges=[[S.att>=1,'🌱 First Step'],[lv>=5,'📘 Reader'],[lv>=L.length,'🎓 All Lessons'],[S.cor>=50,'🎯 Sharp Shooter'],[S.streak>=3,'🔥 3-Day Streak'],[S.tests.some(x=>x.n==='Grand Test'&&x.s/x.t>=.8),'🏆 Grand Champion']];
app.innerHTML=back()+`<h1>📈 ${t('My Progress','ನನ್ನ ಪ್ರಗತಿ')}</h1><div class="stat"><div><b>${S.xp}</b>XP</div><div><b>${lvl}</b>Level</div><div><b>${acc}%</b>Accuracy</div><div><b>${S.att}</b>Attempted</div><div><b>${lv}/${L.length}</b>Lessons</div><div><b>${S.streak}</b>Day streak</div><div><b>${S.mist.length}</b>Mistakes</div><div><b>${S.bm.length}</b>Bookmarks</div></div>
<div class="card"><h3>Lesson completion</h3><div class="bar"><i style="width:${lv/L.length*100}%"></i></div></div>
<div class="card"><h3>Topic accuracy</h3>${Object.entries(S.typeStats).map(([k,v])=>`<div>${TYPES[k]} — ${Math.round(v[1]/v[0]*100)}% (${v[1]}/${v[0]})<div class="bar"><i style="width:${v[1]/v[0]*100}%"></i></div></div>`).join('')||'<p>No attempts yet.</p>'}</div>
<div class="card"><h3>Badges</h3>${badges.map(([ok,n])=>`<span class="chip" style="opacity:${ok?1:.35}">${n}</span>`).join('')}</div>
<div class="card"><h3>Test history</h3>${S.tests.slice(-10).reverse().map(x=>`<div>${x.d} • ${x.n}: <b>${x.s}/${x.t}</b></div>`).join('')||'<p>No tests yet.</p>'}</div>`};
V.settings=()=>{app.innerHTML=back()+`<h1>⚙️ Settings</h1><div class="card"><div class="row"><button class="btn" onclick="toggleLang();V.settings()">Language: ${KN()?'ಕನ್ನಡ':'English'}</button><button class="btn" onclick="toggleDark()">Dark mode</button></div></div>
<div class="card"><h3>Reset</h3><div class="row"><button class="btn warn" onclick="rs('mist')">Reset Mistake Book</button><button class="btn warn" onclick="rs('bm')">Reset Bookmarks</button><button class="btn warn" onclick="rs('prog')">Reset Progress</button><button class="btn warn" onclick="rs('all')">Reset Everything</button></div></div>`};
function rs(k){if(!confirm('Are you sure? This cannot be undone.'))return;if(k==='mist')S.mist=[];if(k==='bm')S.bm=[];if(k==='prog'){S.done={};S.att=0;S.cor=0;S.typeStats={};S.xp=0;S.tests=[];S.daily={}}if(k==='all'){localStorage.removeItem(LS);location.reload();return}save();toast('Reset done')}

/* ---------- SEARCH ---------- */
function doSearch(v){v=v.trim().toLowerCase();if(!v){V.home();return}
 const ls=L.filter(l=>(l.en+l.kn+l.d+l.ex.join(' ')).toLowerCase().includes(v));const bs=BANK.filter(b=>b.join(' ').toLowerCase().includes(v));const fs=FORM.filter(f=>f.join(' ').toLowerCase().includes(v));
 app.innerHTML=`<h1>🔍 "${esc(v)}"</h1>${bs.length?`<div class="card"><h3>Adjective forms</h3><table>${bs.map(b=>`<tr><td>${b[0]}</td><td>${b[1]}</td><td>${b[2]}</td><td>${b[3]}</td><td>${sp(b[0])}</td></tr>`).join('')}</table></div>`:''}
 ${fs.length?`<div class="card"><h3>Word formation</h3>${fs.map(f=>`<div>${f[0]} + ${f[2]} → <b>${f[1]}</b></div>`).join('')}</div>`:''}
 ${ls.map(lessonHTML).join('')}${!ls.length&&!bs.length&&!fs.length?(()=>{const d=degreesOf(v);return `<div class="card">No lesson found. Predicted degrees: <b>${d[0]} – ${d[1]} – ${d[2]}</b></div>`})():''}`}

/* ---------- TOGGLES / INIT ---------- */
function toggleLang(){S.lang=KN()?'en':'kn';save();applyUI();const h=location.hash.slice(1);(V[h]||V.home)()}
function toggleDark(){S.dark=!S.dark;save();applyUI()}
function applyUI(){document.body.classList.toggle('dark',S.dark);$('langBtn').textContent=KN()?'English':'ಕನ್ನಡ';$('langBtn').classList.toggle('on',KN());document.documentElement.lang=KN()?'kn':'en'}
if('speechSynthesis' in window)speechSynthesis.getVoices();
applyUI();go(location.hash.slice(1)||'home');
</script>
</body>
</html>
